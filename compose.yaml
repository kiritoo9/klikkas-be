services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: klikkas-be:${IMAGE_TAG:-latest}
    restart: unless-stopped
    init: true
    environment:
      SPRING_PROFILES_ACTIVE: production
      DB_HOST: ${DB_HOST:?DB_HOST wajib diisi di file .env}
      DB_PORT: ${DB_PORT:-5432}
      DB_NAME: ${DB_NAME:?DB_NAME wajib diisi di file .env}
      DB_USERNAME: ${DB_USERNAME:?DB_USERNAME wajib diisi di file .env}
      DB_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD wajib diisi di file .env}
      JAVA_OPTS: ${JAVA_OPTS:--XX:MaxRAMPercentage=75.0 -XX:+UseG1GC}
    ports:
      - "${APP_PORT:-5001}:5001"
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:5001/healthcheck"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    networks:
      - backend

networks:
  backend:
    driver: bridge
