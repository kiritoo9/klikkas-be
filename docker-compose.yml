version: '3.8'

# Usage:
# 1. cp .env.example .env
# 2. Fill in your values in .env
# 3. docker-compose up -d

services:
  app:
    build:
      context: .
      args:
        APP_NAME: ${APP_NAME}
        APP_PORT: ${APP_PORT}
        DB_HOST: ${DB_HOST:-db}
        DB_PORT: ${DB_PORT}
        DB_NAME: ${DB_NAME}
    ports:
      - "${APP_PORT:-5001}:${APP_PORT:-5001}"
    env_file:
      - path: .env
        required: true
    environment:
      - DB_HOST=db
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:16-alpine
    env_file:
      - path: .env
        required: true
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
